<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Padel Pro – Schedules</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-900 text-white">
  <header id="siteHeader"></header>

  <main class="pt-28 pb-12">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-end justify-between mb-6">
        <h1 class="section-title">Season Schedules</h1>
        <a class="btn" href="index.html">Home</a>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <section class="round-wrap">
          <div class="round-title">Championship (PADEL24)</div>
          <div class="overflow-x-auto">
            <table class="sched">
              <thead>
                <tr>
                  <th>Round</th><th>Match</th><th>Tier</th><th>Venue</th><th>Date</th><th>Fixture</th>
                </tr>
              </thead>
              <tbody id="tblChamp"></tbody>
            </table>
          </div>
        </section>

        <section class="round-wrap">
          <div class="round-title">Premier (Play360)</div>
          <div class="overflow-x-auto">
            <table class="sched">
              <thead>
                <tr>
                  <th>Round</th><th>Match</th><th>Tier</th><th>Venue</th><th>Date</th><th>Fixture</th>
                </tr>
              </thead>
              <tbody id="tblPrem"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer id="siteFooter"></footer>
  <script type="module" src="js/app.js?v=10"></script>
</body>
</html>
