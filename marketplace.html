<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Padel Pro – Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-900 text-white">
  <header id="siteHeader"></header>

  <main class="pt-28 pb-12">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-end justify-between mb-6">
        <h1 class="section-title">Marketplace</h1>
        <a class="btn" href="index.html">Home</a>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="market-card">
          <div class="market-thumb"></div>
          <div class="market-title">Padel Racket — Pro Control</div>
          <div class="market-sub">R2,999 • In stock</div>
          <button class="btn-secondary w-full mt-2">Details</button>
        </div>
        <div class="market-card">
          <div class="market-thumb"></div>
          <div class="market-title">Coaching Session (1 hr)</div>
          <div class="market-sub">R450 • Bookable</div>
          <button class="btn-secondary w-full mt-2">Book</button>
        </div>
        <div class="market-card">
          <div class="market-thumb"></div>
          <div class="market-title">Team Jersey</div>
          <div class="market-sub">R399 • Sizes S–XL</div>
          <button class="btn-secondary w-full mt-2">Buy</button>
        </div>
      </div>
    </div>
  </main>

  <footer id="siteFooter"></footer>
  <script type="module" src="js/app.js?v=10"></script>
</body>
</html>
